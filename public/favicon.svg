<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Inner Dark Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Text / Emblem Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" opacity="0.4" filter="url(#glow)" />

  <!-- Outer Gradient Border -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Liquid Glass Body -->
  <rect x="52" y="52" width="408" height="408" rx="108" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Glass Highlight Curve -->
  <path d="M60 160 C 160 80, 352 80, 452 160" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Modern Stylized "E" with Celebration Shapes -->
  <!-- Top Bar -->
  <rect x="150" y="140" width="190" height="44" rx="22" fill="url(#textGrad)" />
  
  <!-- Vertical Spine -->
  <rect x="150" y="140" width="48" height="232" rx="24" fill="url(#textGrad)" />
  
  <!-- Middle Dynamic Bar -->
  <rect x="150" y="234" width="140" height="44" rx="22" fill="url(#textGrad)" />
  
  <!-- Bottom Bar -->
  <rect x="150" y="328" width="190" height="44" rx="22" fill="url(#textGrad)" />

  <!-- Sparkle 1 (Top Right) -->
  <path d="M375 140 Q 375 170 405 170 Q 375 170 375 200 Q 375 170 345 170 Q 375 170 375 140 Z" fill="#38bdf8" />

  <!-- Sparkle 2 (Small Accent) -->
  <circle cx="330" cy="256" r="10" fill="#f472b6" />
</svg>
